[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleome"
version = "0.1.0"
description = "Dynamic unicode-range WOFF2 slicer and @font-face CSS generator for Japanese, Korean, and Chinese web fonts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.15"
dependencies = [
    "fonttools[woff]>=4.67.0",
    "brotli>=1.2.1",
]

[project.optional-dependencies]
test = [
    "uharfbuzz>=0.56.4",
]

[dependency-groups]
dev = [
    "uharfbuzz>=0.56.4",
]
test = [
    "uharfbuzz>=0.56.4",
]

[project.scripts]
cleome = "cleome.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cleome"]
