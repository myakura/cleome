name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python 3.15
        run: uv python install 3.15

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c '
          import os, pathlib, sys, tomllib
          tag = os.environ["TAG_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              sys.exit(f"Release tag {tag!r} does not match pyproject.toml version {expected_tag!r}")
          '

      - name: Install dependencies and verify test suite
        run: |
          uv sync --frozen
          uv run ruff check
          uv run ruff format --check
          uv run pytest

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cleome
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
