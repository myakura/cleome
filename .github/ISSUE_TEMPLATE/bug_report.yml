name: Bug Report
description: Report a slicing, OpenType subsetting, or @font-face CSS generation bug in Cleome
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Isolate the reproduction to `cleome` APIs or CLI commands and run it before submitting.
  - type: textarea
    id: what-happens
    attributes:
      label: What Happens?
      description: Describe the observed behavior, including the affected `cleome` functions or classes (`src/cleome/...`), target CJK locale (`jp`, `kr`, `sc`, `tc`, `hk`), and the output or exception.
      placeholder: |
        Calling `...` or running `cleome plan ...` raises / returns `...`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to Reproduce?
      description: Provide a self-contained Python 3.15+ snippet or `cleome plan` / `cleome build` CLI command using only `cleome` and `fontTools`. Every `assert` or comment must match actual runtime output.
      render: python
      placeholder: |
        from cleome import SliceConfig, build_slice_plan

        # Verified runtime output:
        assert ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What Should Happen?
      description: Describe the expected slice plan, `.woff2` subsetting behavior, or `@font-face` CSS output, citing the relevant OpenType, WOFF2, or W3C CSS Fonts specification when applicable.
    validations:
      required: true
