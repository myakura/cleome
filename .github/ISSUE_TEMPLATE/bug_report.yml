name: Bug Report
description: Report a slicing, OpenType subsetting, or @font-face CSS generation bug in Cleome
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Cleome! Please isolate the reproduction to `cleome` APIs or `cleome plan` / `cleome build` CLI commands and verify all assertions against actual runtime output before submitting.
  - type: textarea
    id: what-happens
    attributes:
      label: What Happens?
      description: Describe the actual behavior, including affected `cleome` functions/classes (`src/cleome/...`), target CJK locale (`jp`, `kr`, `sc`, `tc`, `hk`), and observed output or exception.
      placeholder: |
        When running `cleome plan ...` or calling `slice_font(...)`, Cleome raises / produces `...`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to Reproduce?
      description: Provide a self-contained Python 3.15+ snippet (using `fontTools` / `cleome`) or `cleome plan` / `cleome build` CLI command and font details that reproduce the issue. Every `assert` or comment should reflect verified runtime output.
      render: python
      placeholder: |
        from cleome import SliceConfig, build_slice_plan

        # Verified runtime output:
        assert ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What Should Happen?
      description: Describe the expected slice plan, `.woff2` subsetting behavior, or `@font-face` CSS output, referencing the relevant OpenType, WOFF2, or W3C CSS Fonts specification if applicable.
    validations:
      required: true
